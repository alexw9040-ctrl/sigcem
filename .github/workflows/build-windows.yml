name: Compilar instalador Windows



on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
    paths:
    
      - 'app.py'
      
      - 'requirements.txt'
      
      - 'templates/**'
      
      - 'static/**'
      
      - 'public/**'
      
      - 'installer/**'
      
      - '.github/workflows/build-windows.yml'
      


permissions:

  contents: read
  


jobs:

  build-windows:
  
    runs-on: windows-latest
    
    timeout-minutes: 20
    


    steps:
    
      - name: Baixar código
      
        uses: actions/checkout@v4
        


      - name: Configurar Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.12'
          


      - name: Instalar dependências
      
        shell: pwsh
        
        run: |
        
          python -m pip install --upgrade pip
          
          python -m pip install -r requirements.txt pyinstaller==6.11.1
          


      - name: Gerar executável
      
        shell: pwsh
        
        run: |
        
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          
          pyinstaller --noconfirm --clean installer\SIGCEM.spec
          
          New-Item -ItemType Directory -Force -Path dist\SIGCEM | Out-Null
          
          Move-Item dist\SIGCEM.exe dist\SIGCEM\SIGCEM.exe
          
          Copy-Item installer\start_sigcem.bat dist\SIGCEM\start_sigcem.bat
          


      - name: Instalar Inno Setup
      
        shell: pwsh
        
        run: choco install innosetup --no-progress -y
        


      - name: Gerar instalador SIGCEM-Setup.exe
      
        shell: pwsh
        
        run: |
        
          if (Test-Path installer\output) { Remove-Item installer\output -Recurse -Force }
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SIGCEM.iss
          


      - name: Disponibilizar executável portátil
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: SIGCEM-Windows-portatil
          
          path: dist/SIGCEM
          
          if-no-files-found: error
          
          retention-days: 30
          


      - name: Disponibilizar instalador
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: SIGCEM-Setup-Windows
          
          path: installer/output/SIGCEM-Setup-*.exe
          
          if-no-files-found: error
          
          retention-days: 30
          


























































