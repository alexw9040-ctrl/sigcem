{% extends 'base.html' %}{% block title %}Editar documento{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Arquivo digital</p><h1>Editar metadados do documento</h1><p>O arquivo original permanece preservado; somente os metadados são alterados.</p></div><a class="btn btn-ghost" href="{{ url_for('documentos') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field"><label>Nome do arquivo</label><input class="input" name="nome" value="{{ record.nome }}" required></div><div class="field"><label>Tipo</label><input class="input" name="tipo" value="{{ record.tipo }}" required></div><div class="field full"><label>Descrição</label><textarea class="textarea" name="descricao">{{ record.descricao or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('documentos') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
