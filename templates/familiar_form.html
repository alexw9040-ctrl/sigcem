{% extends 'base.html' %}{% block title %}Editar familiar{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Pessoas relacionadas</p><h1>Editar familiar ou responsável</h1><p>O histórico de vínculos permanece preservado.</p></div><a class="btn btn-ghost" href="{{ url_for('familiares') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field full"><label>Nome completo *</label><input class="input" name="nome" value="{{ record.nome }}" required></div><div class="field"><label>CPF</label><input class="input" name="cpf" value="{{ record.cpf or '' }}"></div><div class="field"><label>RG</label><input class="input" name="rg" value="{{ record.rg or '' }}"></div><div class="field"><label>Telefone</label><input class="input" name="telefone" value="{{ record.telefone or '' }}"></div><div class="field"><label>WhatsApp</label><input class="input" name="whatsapp" value="{{ record.whatsapp or '' }}"></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="{{ record.email or '' }}"></div><div class="field"><label>Parentesco</label><input class="input" name="parentesco" value="{{ record.parentesco or '' }}"></div><div class="field"><label>Município</label><input class="input" name="municipio" value="{{ record.municipio or '' }}"></div><div class="field full"><label>Endereço</label><input class="input" name="endereco" value="{{ record.endereco or '' }}"></div><div class="field full"><label>Observações</label><textarea class="textarea" name="observacoes">{{ record.observacoes or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('familiares') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
