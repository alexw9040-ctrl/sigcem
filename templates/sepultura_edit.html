{% extends 'base.html' %}{% block title %}Editar unidade física{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Levantamento cadastral</p><h1>Editar unidade {{ record.codigo }}</h1><p>O código e o histórico de sepultamentos são preservados.</p></div><a class="btn btn-ghost" href="{{ url_for('sepulturas') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid three"><div class="field"><label>Código único</label><input class="input" value="{{ record.codigo }}" disabled></div><div class="field"><label>Quadra *</label><input class="input" name="quadra" value="{{ record.quadra }}" required></div><div class="field"><label>Rua/alameda</label><input class="input" name="rua" value="{{ record.rua or '' }}"></div><div class="field"><label>Lote</label><input class="input" name="lote" value="{{ record.lote or '' }}"></div><div class="field"><label>Número *</label><input class="input" name="numero" value="{{ record.numero }}" required></div><div class="field"><label>Tipo</label><select class="select" name="structure_type">{% for item in ['Sepultura','Túmulo','Jazigo','Catacumba','Gaveta','Ossuário','Nicho'] %}<option {% if record.structure_type==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Capacidade</label><input class="input" type="number" name="capacity" min="{{ record.used if record.used else 1 }}" value="{{ record.capacity }}"></div><div class="field"><label>Situação</label><select class="select" name="status">{% for item in statuses %}<option {% if record.status==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Responsável</label><select class="select" name="responsavel_id"><option value="">Não informado</option>{% for r in relatives %}<option value="{{ r.id }}" {% if record.responsavel_id==r.id %}selected{% endif %}>{{ r.nome }}</option>{% endfor %}</select></div><div class="field"><label>Posição X</label><input class="input" type="number" name="x" value="{{ record.x or '' }}"></div><div class="field"><label>Posição Y</label><input class="input" type="number" name="y" value="{{ record.y or '' }}"></div><div class="field full"><label>Observações</label><textarea class="textarea" name="observacoes">{{ record.observacoes or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('sepulturas') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
