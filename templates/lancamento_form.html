{% extends 'base.html' %}{% block title %}Editar lançamento{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Financeiro configurável</p><h1>Editar lançamento financeiro</h1><p>O lançamento permanece auditado.</p></div><a class="btn btn-ghost" href="{{ url_for('financeiro') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field"><label>Responsável *</label><input class="input" name="responsavel" value="{{ record.responsavel }}" required></div><div class="field"><label>CPF</label><input class="input" name="cpf" value="{{ record.cpf or '' }}"></div><div class="field"><label>Protocolo/DAM</label><input class="input" name="protocolo" value="{{ record.protocolo or '' }}"></div><div class="field"><label>Situação</label><select class="select" name="status">{% for item in ['Pendente','Pago','Isento','Cancelado','Em análise'] %}<option {% if record.status==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Data de pagamento</label><input class="input" type="date" name="data_pagamento" value="{{ record.data_pagamento or '' }}"></div><div class="field full"><label>Fundamento da isenção/observação</label><textarea class="textarea" name="fundamento">{{ record.fundamento or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('financeiro') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
