{% extends 'base.html' %}{% block title %}Editar solicitação{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Atendimento ao cidadão</p><h1>Editar protocolo {{ record.protocolo }}</h1><p>O número do protocolo não é alterado; os demais dados ficam auditados.</p></div><a class="btn btn-ghost" href="{{ url_for('solicitacoes') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field"><label>Data de abertura</label><input class="input" type="date" name="data_abertura" value="{{ record.data_abertura }}"></div><div class="field"><label>Requerente *</label><input class="input" name="requerente" value="{{ record.requerente }}" required></div><div class="field"><label>CPF</label><input class="input" name="cpf" value="{{ record.cpf or '' }}"></div><div class="field"><label>Telefone</label><input class="input" name="telefone" value="{{ record.telefone or '' }}"></div><div class="field"><label>Tipo</label><select class="select" name="tipo">{% for item in tipos %}<option {% if record.tipo==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Situação</label><select class="select" name="status">{% for item in statuses %}<option {% if record.status==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field full"><label>Descrição</label><textarea class="textarea" name="descricao">{{ record.descricao or '' }}</textarea></div><div class="field full"><label>Despacho</label><textarea class="textarea" name="despacho">{{ record.despacho or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('solicitacoes') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
