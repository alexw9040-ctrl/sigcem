{% extends 'base.html' %}{% block title %}Editar serviço{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Financeiro configurável</p><h1>Editar serviço ou taxa</h1><p>Altere vigência e fundamento sem apagar os lançamentos anteriores.</p></div><a class="btn btn-ghost" href="{{ url_for('financeiro') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field full"><label>Nome do serviço *</label><input class="input" name="nome" value="{{ record.nome }}" required></div><div class="field"><label>Valor vigente</label><input class="input" type="number" step="0.01" name="valor" value="{{ record.valor }}"></div><div class="field"><label>Início da vigência</label><input class="input" type="date" name="vigencia" value="{{ record.vigencia or '' }}"></div><div class="field"><label>Ativo</label><select class="select" name="ativo"><option value="1" {% if record.ativo %}selected{% endif %}>Sim</option><option value="0" {% if not record.ativo %}selected{% endif %}>Não</option></select></div><div class="field full"><label>Fundamento legal</label><textarea class="textarea" name="fundamento">{{ record.fundamento or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('financeiro') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
