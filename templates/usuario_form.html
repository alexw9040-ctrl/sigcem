{% extends 'base.html' %}{% block title %}Editar usuário{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Administração</p><h1>Editar usuário</h1><p>A senha só é alterada quando informada.</p></div><a class="btn btn-ghost" href="{{ url_for('usuarios') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field"><label>Nome *</label><input class="input" name="nome" value="{{ record.nome }}" required></div><div class="field"><label>Usuário *</label><input class="input" name="username" value="{{ record.username }}" required></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="{{ record.email or '' }}"></div><div class="field"><label>Perfil</label><select class="select" name="perfil">{% for item in perfis %}<option {% if record.perfil==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Nova senha</label><input class="input" type="password" name="password" minlength="8"><small>Deixe vazio para manter a senha.</small></div><div class="field"><label>Bloqueado</label><select class="select" name="bloqueado"><option value="0" {% if not record.bloqueado %}selected{% endif %}>Não</option><option value="1" {% if record.bloqueado %}selected{% endif %}>Sim</option></select></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('usuarios') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
