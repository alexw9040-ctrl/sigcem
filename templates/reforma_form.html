{% extends 'base.html' %}{% block title %}Editar obra{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow-dark">Registro administrativo</p><h1>Editar obra {{ record.protocolo }}</h1><p>As alterações ficam registradas na auditoria.</p></div><a class="btn btn-ghost" href="{{ url_for('reformas') }}">← Voltar</a></div><form class="card" method="post"><div class="card-body"><div class="form-grid"><div class="field"><label>Data da solicitação</label><input class="input" type="date" name="data_solicitacao" value="{{ record.data_solicitacao }}"></div><div class="field"><label>Solicitante *</label><input class="input" name="solicitante" value="{{ record.solicitante }}" required></div><div class="field"><label>CPF</label><input class="input" name="cpf" value="{{ record.cpf or '' }}"></div><div class="field"><label>Telefone</label><input class="input" name="telefone" value="{{ record.telefone or '' }}"></div><div class="field"><label>Tipo de serviço</label><select class="select" name="tipo">{% for item in tipos %}<option {% if record.tipo==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Responsável pela execução</label><input class="input" name="executor" value="{{ record.executor or '' }}"></div><div class="field"><label>Situação</label><select class="select" name="status">{% for item in statuses %}<option {% if record.status==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>Falecido relacionado</label><select class="select" name="deceased_id"><option value="">Não informado</option>{% for d in deceased_rows %}<option value="{{ d.id }}" {% if record.deceased_id==d.id %}selected{% endif %}>{{ d.nome }}</option>{% endfor %}</select></div><div class="field"><label>Sepultura relacionada</label><select class="select" name="grave_id"><option value="">Não informado</option>{% for g in grave_rows %}<option value="{{ g.id }}" {% if record.grave_id==g.id %}selected{% endif %}>{{ g.codigo }}</option>{% endfor %}</select></div><div class="field full"><label>Descrição da obra</label><textarea class="textarea" name="descricao">{{ record.descricao or '' }}</textarea></div><div class="field full"><label>Observações</label><textarea class="textarea" name="observacoes">{{ record.observacoes or '' }}</textarea></div><div class="field full"><label>Justificativa da alteração</label><textarea class="textarea" name="justificativa" required></textarea></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('reformas') }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></div></form>{% endblock %}
